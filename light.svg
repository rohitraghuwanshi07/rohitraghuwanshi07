
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Rohit Raghuvanshi — Developer Terminal</title>
  <desc id="desc">A light animated terminal banner about software development, AI and machine learning, data analytics, and systems engineering.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F4F8FF"/>
      <stop offset=".55" stop-color="#EAF3FF"/>
      <stop offset="1" stop-color="#F1FCF9"/>
    </linearGradient>
    <linearGradient id="accent" x1="80" y1="40" x2="1100" y2="320" gradientUnits="userSpaceOnUse">
      <stop stop-color="#087F70"/>
      <stop offset="1" stop-color="#2869CF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#F8FBFF"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#53769E" stroke-opacity=".1" stroke-width="1"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="5" stdDeviation="8" flood-color="#466B98" flood-opacity=".12"/>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="360" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <g fill="#2869CF" opacity=".35">
      <circle cx="1020" cy="46" r="2"/><circle cx="1060" cy="78" r="2"/>
      <circle cx="1112" cy="44" r="2"/><circle cx="1150" cy="92" r="2"/>
      <circle cx="1088" cy="132" r="2"/><circle cx="1162" cy="164" r="2"/>
      <circle cx="1018" cy="190" r="2"/><circle cx="1132" cy="224" r="2"/>
    </g>
    <g stroke="#087F70" stroke-opacity=".28" stroke-width="1.2">
      <path d="M1020 46L1060 78L1112 44L1150 92L1088 132L1162 164"/>
      <path d="M1088 132L1018 190L1132 224"/>
    </g>

    <rect x="44" y="35" width="1112" height="290" rx="18" fill="url(#panel)" stroke="#6E8FB7" stroke-opacity=".4" filter="url(#shadow)"/>
    <path d="M44 85H1156" stroke="#6E8FB7" stroke-opacity=".28"/>

    <circle cx="70" cy="60" r="5" fill="#E45B61"/>
    <circle cx="89" cy="60" r="5" fill="#D69B20"/>
    <circle cx="108" cy="60" r="5" fill="#168A76"/>
    <text x="600" y="65" fill="#526B8B" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="2">ROHIT@GITHUB: ~</text>

    <text x="78" y="119" fill="#087F70" font-family="monospace" font-size="13">$ whoami</text>
    <text x="78" y="158" fill="#14263F" font-family="monospace" font-size="32" font-weight="700">Rohit Raghuvanshi</text>
    <text x="79" y="186" fill="#526B8B" font-family="monospace" font-size="14">Software Development · AI/ML · Systems</text>

    <text x="78" y="224" fill="#087F70" font-family="monospace" font-size="13">$ interests --list</text>
    <text x="78" y="249" fill="#304765" font-family="monospace" font-size="13">Python / Data Analytics / Visualization</text>
    <text x="78" y="271" fill="#304765" font-family="monospace" font-size="13">Backend / Operating Systems / Debugging</text>
    <text x="78" y="299" fill="#2869CF" font-family="monospace" font-size="12">status: learning by building</text>

    <g transform="translate(805 112)">
      <rect width="300" height="165" rx="12" fill="#F4F8FE" stroke="#168A76" stroke-opacity=".5"/>
      <text x="18" y="27" fill="#526B8B" font-family="monospace" font-size="11">~/profile/session</text>
      <path d="M18 39H282" stroke="#6E8FB7" stroke-opacity=".3"/>
      <text x="18" y="65" fill="#087F70" font-family="monospace" font-size="12">$ build --ideas</text>
      <text x="18" y="88" fill="#304765" font-family="monospace" font-size="12">chat.application</text>
      <text x="18" y="109" fill="#304765" font-family="monospace" font-size="12">systems.exploration</text>
      <text x="18" y="130" fill="#304765" font-family="monospace" font-size="12">data.insights</text>
      <rect x="18" y="143" width="8" height="13" rx="1" fill="#087F70">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="34" y="154" fill="#526B8B" font-family="monospace" font-size="10">await next idea...</text>
    </g>

    <rect x="44" y="86" width="1112" height="2" fill="#168A76" opacity=".6">
      <animate attributeName="opacity" values=".2;.8;.2" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="44" y="0" width="1112" height="2" fill="#2869CF" opacity=".35">
      <animate attributeName="y" values="0;358;0" dur="8s" repeatCount="indefinite"/>
    </rect>

    <text x="1120" y="307" fill="#7187A3" font-family="monospace" font-size="10" text-anchor="end">v.01 // KEEP BUILDING</text>
  </g>
</svg>
