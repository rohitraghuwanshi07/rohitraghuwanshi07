
<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" fill="none" role="img" aria-labelledby="title desc">
  <title id="title">Rohit Raghuvanshi — Developer Terminal</title>
  <desc id="desc">A dark animated terminal banner about software development, AI and machine learning, data analytics, and systems engineering.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#080D18"/>
      <stop offset="0.55" stop-color="#101B30"/>
      <stop offset="1" stop-color="#07121D"/>
    </linearGradient>
    <linearGradient id="accent" x1="90" y1="60" x2="1050" y2="300" gradientUnits="userSpaceOnUse">
      <stop stop-color="#58E6C5"/>
      <stop offset="1" stop-color="#70A7FF"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#131F33" stop-opacity=".97"/>
      <stop offset="1" stop-color="#0A1322" stop-opacity=".97"/>
    </linearGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" stroke="#8FA9CE" stroke-opacity=".08" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="clip">
      <rect width="1200" height="360" rx="22"/>
    </clipPath>
  </defs>

  <g clip-path="url(#clip)">
    <rect width="1200" height="360" rx="22" fill="url(#bg)"/>
    <rect width="1200" height="360" fill="url(#grid)"/>

    <g fill="#6EA9FF" opacity=".45">
      <circle cx="1020" cy="46" r="2"/><circle cx="1060" cy="78" r="2"/>
      <circle cx="1112" cy="44" r="2"/><circle cx="1150" cy="92" r="2"/>
      <circle cx="1088" cy="132" r="2"/><circle cx="1162" cy="164" r="2"/>
      <circle cx="1018" cy="190" r="2"/><circle cx="1132" cy="224" r="2"/>
    </g>
    <g stroke="#58E6C5" stroke-opacity=".28" stroke-width="1.2">
      <path d="M1020 46L1060 78L1112 44L1150 92L1088 132L1162 164"/>
      <path d="M1088 132L1018 190L1132 224"/>
    </g>

    <rect x="44" y="35" width="1112" height="290" rx="18" fill="url(#panel)" stroke="#7291BA" stroke-opacity=".3"/>
    <path d="M44 85H1156" stroke="#7291BA" stroke-opacity=".25"/>

    <circle cx="70" cy="60" r="5" fill="#FF6B70"/>
    <circle cx="89" cy="60" r="5" fill="#FFC857"/>
    <circle cx="108" cy="60" r="5" fill="#58E6C5"/>
    <text x="600" y="65" fill="#91A4C0" font-family="monospace" font-size="12" text-anchor="middle" letter-spacing="2">ROHIT@GITHUB: ~</text>

    <text x="78" y="119" fill="#58E6C5" font-family="monospace" font-size="13">$ whoami</text>
    <text x="78" y="158" fill="#F1F6FF" font-family="monospace" font-size="32" font-weight="700">Rohit Raghuvanshi</text>
    <text x="79" y="186" fill="#9CB0CC" font-family="monospace" font-size="14">Software Development · AI/ML · Systems</text>

    <text x="78" y="224" fill="#58E6C5" font-family="monospace" font-size="13">$ interests --list</text>
    <text x="78" y="249" fill="#D5E2F5" font-family="monospace" font-size="13">Python / Data Analytics / Visualization</text>
    <text x="78" y="271" fill="#D5E2F5" font-family="monospace" font-size="13">Backend / Operating Systems / Debugging</text>
    <text x="78" y="299" fill="#70A7FF" font-family="monospace" font-size="12">status: learning by building</text>

    <g transform="translate(805 112)">
      <rect width="300" height="165" rx="12" fill="#08101D" stroke="#58E6C5" stroke-opacity=".38"/>
      <text x="18" y="27" fill="#8EA5C5" font-family="monospace" font-size="11">~/profile/session</text>
      <path d="M18 39H282" stroke="#7B91B2" stroke-opacity=".22"/>
      <text x="18" y="65" fill="#58E6C5" font-family="monospace" font-size="12">$ build --ideas</text>
      <text x="18" y="88" fill="#D5E2F5" font-family="monospace" font-size="12">chat.application</text>
      <text x="18" y="109" fill="#D5E2F5" font-family="monospace" font-size="12">systems.exploration</text>
      <text x="18" y="130" fill="#D5E2F5" font-family="monospace" font-size="12">data.insights</text>
      <rect x="18" y="143" width="8" height="13" rx="1" fill="#58E6C5" filter="url(#glow)">
        <animate attributeName="opacity" values="1;0.15;1" dur="1.1s" repeatCount="indefinite"/>
      </rect>
      <text x="34" y="154" fill="#8198B9" font-family="monospace" font-size="10">await next idea...</text>
    </g>

    <rect x="44" y="86" width="1112" height="2" fill="#58E6C5" opacity=".7">
      <animate attributeName="opacity" values=".25;.8;.25" dur="4s" repeatCount="indefinite"/>
    </rect>
    <rect x="44" y="0" width="1112" height="2" fill="#70A7FF" opacity=".45">
      <animate attributeName="y" values="0;358;0" dur="8s" repeatCount="indefinite"/>
    </rect>

    <text x="1120" y="307" fill="#607895" font-family="monospace" font-size="10" text-anchor="end">v.01 // KEEP BUILDING</text>
  </g>
</svg>
